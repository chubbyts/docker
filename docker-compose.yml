name: chubbyts
services:
  node:
    container_name: chubbyts-node
    hostname: chubbyts-node
    build:
      dockerfile: ./docker/node/Dockerfile
      context: ./
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    userns_mode: keep-id
    environment:
      MONGODB_URI: mongodb://root:GEUvJ0egRX479axgMUcU@mongo:27017/?authSource=admin
      POSTGRES_URL: pgsql://root:NeOnLM8W7ZC58XQe01Hc@postgres:5432?charset=utf8
      SSH_AUTH_SOCK: /ssh-agent
      LLAMA_BASE_URL: http://host.docker.internal:9931/v1
      # claude: keep .claude.json within the mounted ~/.claude instead of ~/.claude.json
      CLAUDE_CONFIG_DIR: /home/node/.claude
    volumes:
      - ${PWD}/..:/app
      - $SSH_AUTH_SOCK:/ssh-agent
      # bash
      - ~/.bash_docker:/home/node/.bash_docker
      - ~/.bash_history:/home/node/.bash_history
      # zsh
      - ~/.zsh_docker:/home/node/.zsh_docker
      - ~/.zsh_history:/home/node/.zsh_history
      # git
      - ~/.gitconfig:/home/node/.gitconfig
      - ~/.gitignore:/home/node/.gitignore
      # ssh
      - ~/.ssh/github.pub:/home/node/.ssh/github.pub
      # npm
      - ~/.npmrc:/home/node/.npmrc
      # claude - coding agent
      - ${PWD}/.home/.claude:/home/node/.claude
      # codex - coding agent
      - ${PWD}/.home/.codex:/home/node/.codex
      # gemini - coding agent
      - ${PWD}/.home/.gemini:/home/node/.gemini
      # opencode - coding agent
      - ${PWD}/.home/.config/opencode:/home/node/.config/opencode
      - ${PWD}/.home/.local/share/opencode:/home/node/.local/share/opencode
      # pi - coding agent
      - ${PWD}/.home/.pi/agent:/home/node/.pi/agent
    depends_on:
      - mongo
      - postgres
    extra_hosts:
      - "host.docker.internal:host-gateway"
  mongo:
    container_name: chubbyts-mongo
    hostname: chubbyts-mongo
    image: mongo:9
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: GEUvJ0egRX479axgMUcU
    ports:
      - '27017:27017'
    volumes:
      - mongo:/data/db
  postgres:
    container_name: chubbyts-postgres
    hostname: chubbyts-postgres
    image: postgres:18
    command: -c log_statement=all -c log_error_verbosity=VERBOSE
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: NeOnLM8W7ZC58XQe01Hc
    ports:
      - '5432:5432'
    volumes:
      - postgres:/var/lib/postgresql

volumes:
  mongo:
  postgres:
